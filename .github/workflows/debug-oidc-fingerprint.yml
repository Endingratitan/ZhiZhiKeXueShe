name: Debug OIDC fingerprint

on:
  workflow_dispatch:

jobs:
  get-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Extract GitHub OIDC fingerprint
        run: |
          jwks_uri=$(curl -s https://token.actions.githubusercontent.com/.well-known/openid-configuration | jq -r .jwks_uri)
          echo "JWKS URI: $jwks_uri"
          # 列出所有包含 x5c 的密钥，并计算其 SHA1 指纹
          curl -s "$jwks_uri" | jq -r '.keys[] | select(.x5c) | "\(.kid) \(.x5c[0])"' | while read kid cert_b64; do
            fingerprint=$(echo "$cert_b64" | base64 -d | openssl x509 -inform der -fingerprint -sha1 -noout | cut -d= -f2 | tr -d ':')
            echo "kid: $kid"
            echo "fingerprint: $fingerprint"
            echo "---"
          done