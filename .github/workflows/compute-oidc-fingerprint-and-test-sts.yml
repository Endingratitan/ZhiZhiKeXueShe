name: Compute OIDC Fingerprint and Test STS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  compute-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch JWKS and extract current GitHub signing certificate
        run: |
          echo "=== Fetching JWKS ==="
          curl -s https://token.actions.githubusercontent.com/.well-known/jwks | jq '.keys[] | select(.kid == "38826b17-6a30-5f9b-b169-8beb8202f723")' > current_key.json
          cat current_key.json | jq .

      - name: Compute SHA-1 fingerprint of the certificate
        id: fingerprint
        run: |
          # 提取 x5c 的第一个证书（PEM 格式）
          cat current_key.json | jq -r '.x5c[0]' > cert.b64
          base64 -d cert.b64 > cert.der
          openssl x509 -in cert.der -inform DER -fingerprint -sha1 -noout | sed 's/.*=//' | tr -d ':' > fingerprint.txt
          FINGERPRINT=$(cat fingerprint.txt)
          echo "Computed SHA-1 fingerprint: $FINGERPRINT"
          echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT

      - name: Attempt STS call with this fingerprint (optional)
        if: env.ALIYUN_ROLE_ARN != ''
        env:
          ALIYUN_ROLE_ARN: ${{ secrets.ALIYUN_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ secrets.ALIYUN_OIDC_ARN }}
        run: |
          JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.aliyuncs.com" | jq -r .value)
          echo "Calling STS AssumeRoleWithOIDC..."
          curl -s "https://sts.aliyuncs.com/?Action=AssumeRoleWithOIDC&RoleArn=${ALIYUN_ROLE_ARN}&OIDCProviderArn=${OIDC_PROVIDER_ARN}&OIDCToken=${JWT}&RoleSessionName=test&Format=JSON&Version=2015-04-01" | jq .
