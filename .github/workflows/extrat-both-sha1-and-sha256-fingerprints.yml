name: Get Correct Fingerprint Based on Kid

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Extract both SHA1 and SHA256 fingerprints
        run: |
          # 获取 OIDC token
          token_response=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.aliyuncs.com")
          oidc_token=$(echo "$token_response" | jq -r .value)

          # 解码 JWT header
          header_b64url=$(echo "$oidc_token" | cut -d. -f1)
          header_b64=$(echo "$header_b64url" | tr '_-' '+/')
          padding=$(( 4 - ${#header_b64} % 4 ))
          if [ $padding -ne 4 ]; then header_b64="${header_b64}$(printf '%.s=' $(seq 1 $padding))"; fi
          header=$(echo "$header_b64" | base64 -d 2>/dev/null)
          echo "JWT header: $header"

          kid=$(echo "$header" | jq -r .kid)
          x5t=$(echo "$header" | jq -r .x5t)
          echo "kid: $kid"
          echo "x5t (SHA1 base64url): $x5t"

          # 从 JWKS 获取对应 kid 的完整密钥信息
          jwks_uri=$(curl -s https://token.actions.githubusercontent.com/.well-known/openid-configuration | jq -r .jwks_uri)
          key_json=$(curl -s "$jwks_uri" | jq ".keys[] | select(.kid == \"$kid\")")
          x5t_s256=$(echo "$key_json" | jq -r '.["x5t#S256"]')
          cert_b64=$(echo "$key_json" | jq -r '.x5c[0]')

          echo "x5t#S256 (SHA256 base64url): $x5t_s256"

          # 方法1:从 x5t 直接解码得到 SHA1 十六进制指纹（避免 openssl 计算误差）
          sha1_hex=$(echo "$x5t" | base64 -d 2>/dev/null | od -A n -t x1 | tr -d ' \n')
          echo "SHA1 fingerprint (from x5t): $sha1_hex"

          # 方法2:从 x5t#S256 解码得到 SHA256 十六进制指纹
          sha256_hex=$(echo "$x5t_s256" | base64 -d 2>/dev/null | od -A n -t x1 | tr -d ' \n')
          echo "SHA256 fingerprint (from x5t#S256): $sha256_hex"

          # 方法3(验证)：用 openssl 直接计算证书的 SHA1 和 SHA256,方便交叉对比
          sha1_openssl=$(echo "$cert_b64" | base64 -d | openssl x509 -inform der -fingerprint -sha1 -noout | cut -d= -f2 | tr -d ':')
          sha256_openssl=$(echo "$cert_b64" | base64 -d | openssl x509 -inform der -fingerprint -sha256 -noout | cut -d= -f2 | tr -d ':')
          echo "SHA1 (openssl): $sha1_openssl"
          echo "SHA256 (openssl): $sha256_openssl"

          echo "=== FINAL FINGERPRINTS TO USE ==="
          echo "SHA1: $sha1_hex"
          echo "SHA256: $sha256_hex"